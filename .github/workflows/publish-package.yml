name: Publish lecture package
on:
  push:
    paths:
      - 'package-ready.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Unpack the verified source bundle
        run: |
          python - <<'PY'
          import base64, hashlib, io, json, pathlib, zipfile
          root = pathlib.Path('.')
          manifest = json.loads((root / 'package-ready.json').read_text())
          encoded = ''.join((root / p).read_text().strip() for p in manifest['parts'])
          data = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(data).hexdigest() == manifest['sha256'], 'Bundle checksum mismatch'
          with zipfile.ZipFile(io.BytesIO(data)) as z:
              for name in z.namelist():
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts
              z.extractall(root)
          PY
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test algorithms and regenerate teaching artifacts
        run: |
          python -m unittest discover -s tests -v
          python tools/build_all.py
      - name: Commit generated package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Publish tested lecture sources and generated artifacts'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra-astar-lecture
          path: dist/dijkstra-astar-lecture.zip
