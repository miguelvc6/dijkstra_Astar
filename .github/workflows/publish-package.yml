name: Publish lecture package
on:
  push:
    paths:
      - 'package-ready.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore the verified source bundle once
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, pathlib
          root = pathlib.Path('.')
          manifest = json.loads((root / 'package-ready.json').read_text())
          assert manifest['codec'] == 'xz-json-v1'
          stamp = root / 'publication/restored.sha256'
          if stamp.exists() and stamp.read_text().strip() == manifest['sha256']:
              print('Sources already restored; rebuilding the current checked-out files.')
          else:
              chunks = []
              for name in manifest['parts']:
                  chunk = (root / name).read_text().strip()
                  assert hashlib.sha256(chunk.encode()).hexdigest() == manifest['part_sha256'][name], name
                  chunks.append(chunk)
              data = base64.b64decode(''.join(chunks), validate=True)
              assert hashlib.sha256(data).hexdigest() == manifest['sha256'], 'Bundle checksum mismatch'
              sources = json.loads(lzma.decompress(data))
              for name, content in sources.items():
                  p = pathlib.PurePosixPath(name)
                  assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
                  target = root / name
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text(content, encoding='utf-8')
              stamp.write_text(manifest['sha256'] + '\n')
              print('Restored', len(sources), 'source files')
          PY
      - name: Install system build prerequisites
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcairo2 fonts-dejavu-core
      - name: Install Python build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test algorithms and regenerate teaching artifacts
        run: |
          python -m unittest discover -s tests -v
          python tools/build_all.py
      - name: Commit generated package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git diff --cached --quiet || git commit -m 'Publish tested lecture sources and generated artifacts'
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: dijkstra-astar-lecture
          path: dist/dijkstra-astar-lecture.zip
